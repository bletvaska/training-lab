apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
  name: nginx
  # namespace: application
spec:
  ports:
  - name: www
    port: 80
    protocol: TCP
    targetPort: 80
    nodePort: 30000
  selector:
    app: nginx
  type: NodePort
  # sticky sessions: requests from the same client IP go to the same pod
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800
