apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx
  # namespace: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:latest
        name: nginx
        resources:
          requests:   # used by the scheduler and by the HPA for utilization
            cpu: 100m
            memory: 64Mi
          limits:     # CPU is throttled, memory over the limit kills the container (OOMKilled)
            cpu: 500m
            memory: 128Mi
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: secrets
